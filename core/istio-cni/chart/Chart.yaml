apiVersion: v2
name: istio-cni
version: 1.30.4-bb.1
appVersion: 1.30.4
description: Helm chart for the Istio CNI node agent (required for ambient mesh). This variant delegates configuration to the Big Bang operator via a Package CR instead of bb-common.
icon: https://istio.io/latest/favicons/android-192x192.png
keywords:
  - istio
  - cni
  - ambient
sources:
  - https://github.com/istio/istio
dependencies:
  - name: cni
    repository: https://blob.istio.io/istio-release/charts
    version: 1.30.4
    alias: upstream
annotations:
  bigbang.dev/passthrough: "true"
  bigbang.dev/passthrough-toplevel-key: upstream
  bigbang.dev/maintenanceTrack: bb_integrated
  helm.sh/images: |
    - name: install-cni
      image: registry1.dso.mil/ironbank/opensource/istio/install-cni:1.30.4
  bigbang.dev/upstreamReleaseNotesMarkdown: |
    - [Find upstream chart's release notes and CHANGELOG here](https://istio.io/latest/news/releases)
