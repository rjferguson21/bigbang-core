mtls:
  # -- STRICT = Allow only mutual TLS traffic,
  # PERMISSIVE = Allow both plain text and mutual TLS traffic
  mode: STRICT

# Renders a bigbang.dev/v1alpha1 Package CR from the istio, networkPolicies,
# and routes values below. Requires the bigbang-operator to be installed.
# The subtrees are passed to the CR spec as-is; anything unset falls back to
# the operator's defaults.
bigbangPackage:
  enabled: true
  labels: {}
  annotations: {}

  istio:
    enabled: false

    authorizationPolicies:
      enabled: true
      generateFromNetpol: true

  networkPolicies:
    enabled: true
    prependReleaseName: true
    # The umbrella injects these per-gateway (bigbang.istio-gateway.ingress-netpol-spec):
    # inbound web traffic from the LB subnets, and egress to any pod so the
    # gateway can reach routed app services. Without them the default-deny set
    # blocks all traffic through the gateway. load-balancer-subnets resolves
    # from the operator's shared definitions (bigbang-operator-global).
    ingress:
      to:
        public-ingressgateway:[8080,8443]:
          from:
            definition:
              load-balancer-subnets: true
    egress:
      from:
        public-ingressgateway:
          to:
            k8s:
              '*': true

# -- Gateway-scoped classification banner configuration. This injects the
# banner at this gateway for matching HTML hosts.
classificationBanner:
  enabled: false
  classificationLevel: unclassified
  text: ""
  addFooter: false
  enabledHosts: []
  # enabledHosts:
  #   - app.example.mil

gateway:
  servers:
    - hosts:
        - '*.dev.bigbang.mil'
      port:
        name: http
        number: 8080
        protocol: HTTP
      tls:
        httpsRedirect: true
    - hosts:
        - '*.dev.bigbang.mil'
      port:
        name: https
        number: 8443
        protocol: HTTPS
      tls:
        credentialName: public-cert
        mode: SIMPLE

waitJob:
  enabled: true
  permissions:
    apiGroups:
    - ''
    - "apps"
    resources:
    - pods
    - deployments
    verbs:
    - patch
    - list
    - get
    - watch

# -- Values passed to the upstream istio gateway chart.
# See [the upstream chart's values.yaml](https://github.com/istio/istio/blob/master/manifests/charts/gateway/values.yaml)
# for configuration options.
upstream:
  service:
    # Type of service. Set to "None" to disable the service entirely
    type: LoadBalancer
    ports:
    - name: tcp-status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
  labels:
    # -- We set this label by default to more easily
    # integrate with other Big Bang components.
    istio: ingressgateway
