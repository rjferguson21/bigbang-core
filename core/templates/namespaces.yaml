# The parent release is the authoritative creator of every package namespace
# (child HelmReleases set createNamespace: false): helm-controller's
# createNamespace can't set labels and would race these objects, creating the
# namespace unlabeled before the labels here could apply. Packages sharing a
# namespace are deduped and their labels merged. Packages with meshInjection get
# the mesh-enrollment label for the active mode: istio.io/dataplane-mode=ambient
# when ambient is on, istio-injection=enabled otherwise.
{{- $v := fromYaml (include "core.merged" .) }}
{{- $ambient := dig "ambient" "enabled" false ($v.istio | default dict) }}
{{- $meshLabel := ternary (dict "istio.io/dataplane-mode" "ambient") (dict "istio-injection" "enabled") $ambient }}
{{- $byNamespace := dict }}
{{- range $name, $pkg := $v.packages }}
{{- if eq (include "core.pkgEnabled" (dict "pkg" $pkg "ambient" $ambient "groups" $v.groups)) "true" }}
{{- $labels := merge (index $byNamespace $pkg.namespace | default dict) ($pkg.namespaceLabels | default dict) }}
{{- if $pkg.meshInjection }}
{{- $labels = merge $labels (deepCopy $meshLabel) }}
{{- end }}
{{- $_ := set $byNamespace $pkg.namespace $labels }}
{{- end }}
{{- end }}
{{- range $namespace, $labels := $byNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  {{- with $labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
