# helm-controller's createNamespace can't set labels, so namespaces that need
# them (e.g. istio-injection) are rendered here by the parent release.
{{- range $name, $pkg := .Values.packages }}
{{- if and $pkg.enabled $pkg.namespaceLabels }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $pkg.namespace }}
  labels:
    {{- toYaml $pkg.namespaceLabels | nindent 4 }}
{{- end }}
{{- end }}
