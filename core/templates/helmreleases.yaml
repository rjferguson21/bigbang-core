{{- range $name, $pkg := .Values.packages }}
{{- if $pkg.enabled }}
{{- $flux := mergeOverwrite (deepCopy $.Values.flux) (deepCopy ($pkg.flux | default dict)) }}
{{- $wave := int ($pkg.wave | default 0) }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  releaseName: {{ $pkg.releaseName | default $name }}
  targetNamespace: {{ $pkg.namespace }}
  chart:
    spec:
      chart: {{ $pkg.chart }}
      # rebuild the chart on every source revision, not just version bumps
      # (the dev flow pushes working-tree snapshots without bumping versions)
      reconcileStrategy: Revision
      sourceRef:
        kind: {{ $.Values.source.kind }}
        name: {{ $.Values.source.name }}
        namespace: {{ $.Values.source.namespace | default $.Release.Namespace }}
  {{- toYaml $flux | nindent 2 }}
  {{- $deps := list }}
  {{- range $depName, $dep := $.Values.packages }}
  {{- if and $dep.enabled (lt (int ($dep.wave | default 0)) $wave) }}
  {{- $deps = append $deps $depName }}
  {{- end }}
  {{- end }}
  {{- if $deps }}
  dependsOn:
    {{- range $deps }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  values:
    {{- $vals := deepCopy $.Values.packageValues }}
    {{- $_ := set $vals "domain" $.Values.domain }}
    {{- with $pkg.values }}{{- $vals = mergeOverwrite $vals (deepCopy .) }}{{- end }}
    {{- toYaml $vals | nindent 4 }}
{{- end }}
{{- end }}
