{{- $v := fromYaml (include "core.merged" .) }}
{{- $ambient := dig "ambient" "enabled" false ($v.istio | default dict) }}
{{- range $name, $pkg := $v.packages }}
{{- if eq (include "core.pkgEnabled" (dict "pkg" $pkg "ambient" $ambient)) "true" }}
{{- $flux := mergeOverwrite (deepCopy $v.flux) (deepCopy ($pkg.flux | default dict)) }}
{{- $wave := int ($pkg.wave | default 0) }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  releaseName: {{ $pkg.releaseName | default $name }}
  targetNamespace: {{ $pkg.namespace }}
  chart:
    spec:
      chart: {{ $pkg.chart }}
      # rebuild the chart on every source revision, not just version bumps
      # (the dev flow pushes working-tree snapshots without bumping versions)
      reconcileStrategy: Revision
      sourceRef:
        kind: {{ $v.source.kind }}
        name: {{ $v.source.name }}
        namespace: {{ $v.source.namespace | default $.Release.Namespace }}
  {{- toYaml $flux | nindent 2 }}
  {{- $deps := list }}
  {{- range $depName, $dep := $v.packages }}
  {{- if and (eq (include "core.pkgEnabled" (dict "pkg" $dep "ambient" $ambient)) "true") (lt (int ($dep.wave | default 0)) $wave) }}
  {{- $deps = append $deps $depName }}
  {{- end }}
  {{- end }}
  {{- if $deps }}
  dependsOn:
    {{- range $deps }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  values:
    {{- $vals := deepCopy $v.packageValues }}
    {{- $_ := set $vals "domain" $v.domain }}
    {{- with $pkg.values }}{{- $vals = mergeOverwrite $vals (deepCopy .) }}{{- end }}
    {{- if $ambient }}
    {{- /* Every Package CR advertises ambient so the operator generates HBONE-aware
           policies and drops the sidecar resource (keyed on spec.istio.ambient.enabled). */}}
    {{- $vals = mergeOverwrite $vals (dict "bigbangPackage" (dict "istio" (dict "ambient" (dict "enabled" true)))) }}
    {{- if eq $name "istiod" }}
    {{- $vals = mergeOverwrite $vals (dict "upstream" (dict "cni" (dict "enabled" true) "pilot" (dict "env" (dict "PILOT_ENABLE_AMBIENT" "true")) "meshConfig" (dict "defaultConfig" (dict "proxyMetadata" (dict "ISTIO_META_ENABLE_HBONE" "true"))))) }}
    {{- /* ambient's default-deny netpols otherwise block ztunnel (no Package CR
           of its own) from reaching istiod XDS on 15012 within istio-system */}}
    {{- $vals = mergeOverwrite $vals (dict "bigbangPackage" (dict "networkPolicies" (dict "enabled" true "ingress" (dict "defaults" (dict "allowInNamespace" (dict "enabled" true))) "egress" (dict "defaults" (dict "allowInNamespace" (dict "enabled" true)))))) }}
    {{- end }}
    {{- end }}
    {{- toYaml $vals | nindent 4 }}
{{- end }}
{{- end }}
