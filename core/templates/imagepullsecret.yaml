# Airgap/Zarf support: copy the registry pull secret Zarf seeds into the release
# namespace into every enabled package namespace, so pods whose image refs the
# zarf-agent rewrote to the in-cluster registry can authenticate. Gated by
# imagePullSecret.copyFromReleaseNamespace (off for normal installs). The lookup
# is empty during `helm template`, so this renders nothing off-cluster.
{{- $v := fromYaml (include "core.merged" .) }}
{{- $cfg := $v.imagePullSecret | default dict }}
{{- if $cfg.copyFromReleaseNamespace }}
{{- $name := $cfg.name | default "private-registry" }}
{{- $src := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if not $src }}
{{- fail (printf "core: imagePullSecret.copyFromReleaseNamespace is set but Secret %q was not found in release namespace %q" $name .Release.Namespace) }}
{{- end }}
{{- $ambient := dig "ambient" "enabled" false ($v.istio | default dict) }}
{{- $namespaces := dict }}
{{- range $pkgName, $pkg := $v.packages }}
{{- if eq (include "core.pkgEnabled" (dict "pkg" $pkg "ambient" $ambient "groups" $v.groups)) "true" }}
{{- $_ := set $namespaces $pkg.namespace true }}
{{- end }}
{{- end }}
{{- range $ns := keys $namespaces | sortAlpha }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: {{ $src.type }}
data:
  {{- range $k, $val := $src.data }}
  {{ $k }}: {{ $val }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
