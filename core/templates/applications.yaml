{{- if not .Values.repoURL }}
{{- fail "repoURL is required: the git repo Argo CD pulls the core charts from (e.g. --set repoURL=https://.../bigbang-core.git)" }}
{{- end }}
{{- range $name, $pkg := .Values.packages }}
{{- if $pkg.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $pkg.syncWave | default 0 | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.argocd.project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ $pkg.chart }}
    helm:
      releaseName: {{ $pkg.releaseName | default $name }}
      valuesObject:
        {{- $vals := deepCopy $.Values.packageValues }}
        {{- $_ := set $vals "domain" $.Values.domain }}
        {{- with $pkg.values }}{{- $vals = mergeOverwrite $vals (deepCopy .) }}{{- end }}
        {{- toYaml $vals | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $pkg.namespace }}
  {{- with $pkg.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    {{- with $pkg.namespaceLabels }}
    managedNamespaceMetadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $.Values.syncPolicy.automated }}
    automated:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    syncOptions:
      {{- toYaml ($pkg.syncOptions | default $.Values.syncPolicy.syncOptions) | nindent 6 }}
{{- end }}
{{- end }}
