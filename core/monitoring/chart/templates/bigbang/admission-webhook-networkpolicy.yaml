{{- if and .Values.bigbangPackage.enabled .Values.bigbangPackage.networkPolicies.enabled .Values.upstream.prometheusOperator.enabled .Values.upstream.prometheusOperator.admissionWebhooks.enabled .Values.upstream.prometheusOperator.admissionWebhooks.patch.enabled (not .Values.upstream.prometheusOperator.admissionWebhooks.certManager.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-admission-webhook-egress
  namespace: {{ .Values.upstream.namespaceOverride | default .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: prometheus-operator-webhook
  policyTypes:
    - Egress
  egress:
    {{- toYaml .Values.hookNetworkPolicies.egress | nindent 4 }}
{{- end }}
