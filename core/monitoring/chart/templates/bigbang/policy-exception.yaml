{{- if .Values.kyvernoPolicyException.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ .Release.Name }}-node-exporter
  namespace: {{ .Values.kyvernoPolicyException.namespace }}
spec:
  background: true
  match:
    any:
      - resources:
          kinds:
            - Pod
            - DaemonSet
          namespaces:
            - {{ .Release.Namespace }}
          names:
            - {{ .Release.Name }}-prometheus-node-exporter*
  exceptions:
    {{- range .Values.kyvernoPolicyException.policies }}
    - policyName: {{ . }}
      ruleNames: ["*"]
    {{- end }}
{{- end }}
