{{- if and .Values.bigbangPackage.enabled .Values.bigbangPackage.networkPolicies.enabled .Values.cleanUpgrade.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-metrics-upgrade-egress
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: bigbang-metrics-upgrade-job
  policyTypes:
    - Egress
  egress:
    {{- toYaml .Values.hookNetworkPolicies.egress | nindent 4 }}
{{- end }}
