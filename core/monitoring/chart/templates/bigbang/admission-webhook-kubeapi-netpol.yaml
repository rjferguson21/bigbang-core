{{- /*
kube-prometheus-stack's admission-webhook patch Jobs run as Helm hooks — create
(pre-install/pre-upgrade) and patch (post-install/post-upgrade) — and call the
kube API to generate the webhook cert and patch the ValidatingWebhookConfiguration.
In ambient mode ztunnel enforces NetworkPolicy, and the namespace default-deny
egress refuses the hook pods' kube-API egress ("connection refused"), crashlooping
the create Job so the HelmRelease never goes Ready. The operator's own netpols are
regular resources created at reconcile time — too late for a pre-install hook — so
allow kube-API egress for the webhook hook pods here, as a hook that lands before
the Jobs. Systemic fix tracked in bigbang-operator#12.
*/}}
{{- if .Values.upstream.prometheusOperator.admissionWebhooks.patch.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-admission-webhook-allow-kubeapi
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus-operator-webhook
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
{{- end }}
