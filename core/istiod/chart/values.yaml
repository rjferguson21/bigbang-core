# Renders a bigbang.dev/v1alpha1 Package CR from the istio, networkPolicies,
# and routes values below. Requires the bigbang-operator to be installed.
# The subtrees are passed to the CR spec as-is; anything unset falls back to
# the operator's defaults.
bigbangPackage:
  enabled: true
  labels: {}
  annotations: {}

  istio:
    enabled: true

    prependReleaseName: true

    authorizationPolicies:
      enabled: true
      generateFromNetpol: true

  networkPolicies:
    # -- Enable or disable the bundled network policies
    enabled: false

    prependReleaseName: true

    egress:
      defaults:
        allowInNamespace:
          enabled: false
        allowIstiod:
          enabled: false
      from:
        istiod:
          to:
            definition:
              kubeAPI: true
    ingress:
      defaults:
        allowInNamespace:
          enabled: false
      to:
        istiod:15014: # Required for applications that monitor istio
          from:
            k8s:
              kiali/kiali: true
              monitoring/prometheus: true
        istiod:[443,15017]: # Access to webhook required by k8s control plane and envoy proxies
          from:
            definition:
              # Narrow via the operator's shared control-plane-subnets definition.
              control-plane-subnets: true
        istiod:[15010,15012]: # Required by both sidecars and ambient mesh (15010 may also be required for apps not using mTLS or external to mesh)
          from:
            k8s:
              "*": true

# -- A list of additional EnvoyFilters to create in the release namespace. Gateway-scoped classification banner configuration is managed by the istio-gateway package.
additionalEnvoyFilters: []
