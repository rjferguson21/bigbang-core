# Parent "app of apps" — sourcing the core chart, which renders the child
# Application per core package. Argo CD honours the children's sync-wave
# annotations during this app's sync, giving ordered rollout
# (istiod -> istio-gateway, kyverno -> kyverno-reporter).
#
# Applied by `task core:deploy` with ${REPO_URL}/${TARGET_REVISION}/${ARGOCD_NAMESPACE}
# substituted; edit and `kubectl apply -f` for manual use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bigbang-core
  namespace: ${ARGOCD_NAMESPACE}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${TARGET_REVISION}
    path: core
    helm:
      valuesObject:
        repoURL: ${REPO_URL}
        targetRevision: ${TARGET_REVISION}
        argocd:
          namespace: ${ARGOCD_NAMESPACE}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${ARGOCD_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
