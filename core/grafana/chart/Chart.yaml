apiVersion: v2
name: grafana
version: 13.2.5-bb.1
appVersion: 13.2.1
kubeVersion: "^1.25.0-0"
description: The leading tool for querying and visualizing time series and metrics. This variant delegates Istio and NetworkPolicy configuration to the Big Bang operator via a Package CR instead of bb-common.
home: https://grafana.com
sources:
  - https://github.com/grafana/grafana
  - https://github.com/grafana-community/helm-charts
annotations:
  bigbang.dev/maintenanceTrack: bb_integrated
  bigbang.dev/upstreamReleaseNotesMarkdown: |
    - [Find our upstream chart's CHANGELOG here](https://github.com/grafana-community/helm-charts/tree/main/charts/grafana#upgrading-an-existing-release-to-a-new-major-version)
    - [and our upstream application release notes here](https://grafana.com/docs/grafana/latest/release-notes/)
  helm.sh/images: |
    - name: grafana
      image: registry1.dso.mil/ironbank/big-bang/grafana/grafana-plugins:13.2.1
    - name: k8s-sidecar
      image: registry1.dso.mil/ironbank/kiwigrid/k8s-sidecar:2.11.2
    - name: init-chown-data
      image: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.8
      condition: initChownData.enabled
    - name: test-framework
      image: registry1.dso.mil/ironbank/opensource/bats/bats:1.14.0
      condition: testFramework.enabled
    - name: base
      image: registry1.dso.mil/ironbank/big-bang/base:2.1.0
    - name: image-renderer
      image: registry1.dso.mil/ironbank/opensource/grafana/grafana-image-renderer:v5.12.3
type: application
dependencies:
  - name: gluon
    version: "1.1.8"
    repository: oci://registry1.dso.mil/bigbang
  - name: grafana
    version: 13.2.5
    repository: https://grafana-community.github.io/helm-charts
    alias: upstream
keywords:
  - monitoring
  - metric
