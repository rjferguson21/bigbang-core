apiVersion: v2
name: loki
description: Helm chart for Grafana Loki wrapping the upstream chart. This variant delegates Istio and NetworkPolicy configuration to the Big Bang operator via a Package CR instead of bb-common.
type: application
appVersion: 3.7.1
version: 6.55.0-bb.5
home: https://grafana.github.io/helm-charts
sources:
  - https://github.com/grafana/loki
  - https://grafana.com/oss/loki/
  - https://grafana.com/docs/loki/latest/
icon: https://grafana.com/docs/loki/latest/logo_and_name.png
dependencies:
  - name: loki
    version: "6.55.0"
    repository: https://grafana.github.io/helm-charts
    alias: upstream
annotations:
  bigbang.dev/maintenanceTrack: bb_integrated
  bigbang.dev/applicationVersions: |
    - Loki: 3.7.1
  bigbang.dev/upstreamReleaseNotesMarkdown: |
    - [Find upstream chart's release notes and CHANGELOG here](https://github.com/grafana/loki/blob/main/production/helm/loki/CHANGELOG.md)
    - [Find upstream application's release notes and CHANGELOG here](https://grafana.com/docs/loki/latest/release-notes/)
  helm.sh/images: |
    - name: loki
      image: registry1.dso.mil/ironbank/opensource/grafana/loki:3.7.1
    - name: kubectl
      image: registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.34.6
    - name: grafana-enterprise-logs
      image: registry1.dso.mil/ironbank/grafana/grafana-enterprise-logs:v3.6.5
      condition: upstream.enterprise.enabled
