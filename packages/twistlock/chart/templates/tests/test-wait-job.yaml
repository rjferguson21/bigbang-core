    spec:
      automountServiceAccountToken: true
{{- end }}

{{- define "twistlock-wait.wait-job-sa" }}
{{- end }}

{{- define "twistlock-wait.wait-job-role" }}
{{- end }}

{{- define "twistlock-wait.wait-job-rolebinding" }}
{{- end }}

{{- if not .Values.deploymentMode.defenderOnly }}
    {{- include "gluon.wait.wait-job-configmap.overrides" (list . "twistlock-wait.wait-configmap") | nindent 0 }}
---
    {{ include "gluon.wait.wait-job.overrides" (list . "twistlock-wait.wait-job") | nindent 0 }}
---
    {{ include "gluon.wait.wait-job-sa.overrides" (list . "twistlock-wait.wait-job-sa") | nindent 0 }}
---
    {{ include "gluon.wait.wait-job-role.overrides" (list . "twistlock-wait.wait-job-role") | nindent 0 }}
---
    {{ include "gluon.wait.wait-job-rolebinding.overrides" (list . "twistlock-wait.wait-job-rolebinding") | nindent 0 }}
