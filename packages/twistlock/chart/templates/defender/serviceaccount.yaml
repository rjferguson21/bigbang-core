{{- if .Values.deploymentMode.defenderOnly }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "twistlock-defender.name" . }}-service
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: {{ .Values.defender.serviceAccount.automountServiceAccountToken }}
secrets:
- name: {{ template "twistlock.name" . }}-secrets
{{- end }}