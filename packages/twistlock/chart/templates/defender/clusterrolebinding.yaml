{{- if .Values.deploymentMode.defenderOnly }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "twistlock-defender.name" . }}-view-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "twistlock-defender.name" . }}-view
subjects:
- apiGroup:
  kind: ServiceAccount
  name: {{ template "twistlock-defender.name" . }}-service
  namespace: {{ .Release.Namespace }}
{{- end }}