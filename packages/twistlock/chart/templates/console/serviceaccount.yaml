{{- if not .Values.deploymentMode.defenderOnly }}
apiVersion: v1
kind: ServiceAccount # Service Account used by the twistlock console
metadata:
  name: {{ template "twistlock-console.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "twistlock-console.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.console.serviceAccount.automountServiceAccountToken }}
{{- end }}