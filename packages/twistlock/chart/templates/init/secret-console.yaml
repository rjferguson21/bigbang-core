{{- if and .Values.init.enabled (not .Values.deploymentMode.defenderOnly) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "twistlock-console.name" . }}
  labels: {{- include "twistlock-init.labels" . | nindent 4 }}
stringData:
  TWISTLOCK_CONSOLE_SERVICE: {{ template "twistlock-console.name" . }}
  TWISTLOCK_CONSOLE_SERVICE_PORT_HTTP_MGMT_HTTP: "{{ .Values.console.ports.managementHttp }}"
  {{- if .Values.console.license }}
  TWISTLOCK_LICENSE: {{ .Values.console.license }}
  {{- end }}
  TWISTLOCK_LOGGING: {{ .Values.console.options.logging | quote }}
  TWISTLOCK_MONITORING: {{ .Values.monitoring.enabled | quote }}
  TWISTLOCK_NETWORK_CONTAINER: {{ .Values.console.options.network.container | quote }}
  TWISTLOCK_NETWORK_HOST: {{ .Values.console.options.network.host | quote }}
  TWISTLOCK_OPTIONS_ENABLED: {{ .Values.console.options.enabled | quote }}
  TWISTLOCK_PASSWORD: {{ required "Valid credentials are required when init is enabled." .Values.console.credentials.password }}
  TWISTLOCK_TELEMETRY: {{ .Values.console.options.telemetry | quote }}
  TWISTLOCK_INTELLIGENCE_UPLOAD_DISABLED: {{ .Values.console.options.intelligence.uploadDisabled | quote }}
  TWISTLOCK_SCAN_SCAN_RUNNING_IMAGES: {{ .Values.console.options.scan.scanRunningImages | quote }}
  TWISTLOCK_LOGON_USE_SUPPORT_CREDENTIALS: {{ .Values.console.options.logon.useSupportCredentials | quote }}
  TWISTLOCK_LOGON_REQUIRE_STRONG_PASSWORD: {{ .Values.console.options.logon.requireStrongPassword | quote }}
  TWISTLOCK_LOGON_BASIC_AUTH_DISABLED: {{ .Values.console.options.logon.basicAuthDisabled | quote }}
  TWISTLOCK_USERNAME: {{ required "Valid credentials are required when init is enabled." .Values.console.credentials.username }}
  
    {{- if .Values.console.groups }}
  TWISTLOCK_GROUPS: |-
    {{- range .Values.console.groups }}
    {{ required "desired group name" .group }}
    {{- required "Role is required for groups." .role | indent 1 }}
    {{- default "oidcGroup" .authType | indent 1 }}
    {{- end }}
  TWISTLOCK_USERS_UPDATE: {{ .Values.console.updateUsers | quote }}
  {{- end }}
  
  {{- if .Values.console.additionalUsers }}
  TWISTLOCK_USERS: |-
    {{- range .Values.console.additionalUsers }}
    {{ required "Username is required for additional users." .username }}
    {{- required "Role is required for additional users." .role | indent 1 }}
    {{- default "basic" .authType | indent 1 }}
    {{- default "" .password | indent 1 }}
    {{- end }}
  TWISTLOCK_USERS_UPDATE: {{ .Values.console.updateUsers | quote }}
  {{- end }}
  TWISTLOCK_TRUSTED_IMAGE_ENABLED: {{ .Values.console.trustedImages.enabled | quote }}
  {{- range $k := list "name" "registryMatches" "defaultEffect" }}
  {{- if hasKey $.Values.console.trustedImages $k }}
  {{- fail (printf "console.trustedImages.%s was removed; use groups[] and rule" $k) }}
  {{- end }}
  {{- end }}
  {{- $allGroups := concat (default list .Values.console.trustedImages.groups) (default list .Values.console.trustedImages.extraGroups) }}
  {{- if not $allGroups }}
  {{- fail "console.trustedImages: groups and extraGroups are both empty; set at least one group or disable with enabled=false" }}
  {{- end }}
  {{- $seen := dict }}
  {{- range $i, $g := $allGroups }}
  {{- if not $g.registryMatches }}
  {{- fail (printf "console.trustedImages: merged groups[%d] (name=%q) has no registryMatches; Twistlock /trust/data rejects empty groups (HTTP 400)" $i $g.name) }}
  {{- end }}
  {{- if hasKey $seen $g.name }}
  {{- fail (printf "console.trustedImages: duplicate group name %q across groups+extraGroups" $g.name) }}
  {{- end }}
  {{- $_ := set $seen $g.name true }}
  {{- end }}
  TWISTLOCK_TRUST_POLICY_JSON: {{ dict "groups" $allGroups "rule" .Values.console.trustedImages.rule | toJson | quote }}
  TWISTLOCK_ISTIO_URL: {{ tpl (first (index .Values.bigbangPackage.routes.inbound "console").hosts) . }}
{{- end }}
