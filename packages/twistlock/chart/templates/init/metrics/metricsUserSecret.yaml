{{- if and .Values.monitoring.enabled .Values.init.enabled (not .Values.deploymentMode.defenderOnly) }}
{{- $secretName := printf "%s-metrics-auth" (include "twistlock-console.name" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if and $existing (hasKey ($existing.data | default dict) "TWISTLOCK_METRICS_PASSWORD") }}
{{-   $password = index $existing.data "TWISTLOCK_METRICS_PASSWORD" | b64dec }}
{{- else }}
{{-   $password = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "twistlock-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
stringData:
  TWISTLOCK_METRICS_USER: "bigbang-metrics-sa"
  TWISTLOCK_METRICS_PASSWORD: {{ $password | quote }}
{{- end }}
