apiVersion: v2
name: twistlock
version: 0.30.0-bb.4
appVersion: 34.05.157
description: Twistlock (Prisma Cloud Compute Edition) for Big Bang. This variant delegates Istio and NetworkPolicy configuration to the Big Bang operator via a Package CR instead of bb-common.
dependencies:
  - name: gluon
    version: 1.1.7
    repository: oci://registry1.dso.mil/bigbang
sources:
  - https://github.com/PaloAltoNetworks/pcs-metrics-monitoring
annotations:
  bigbang.dev/maintenanceTrack: bb_integrated
  # The base image is utilized when init job is enabled and during upgrades when volumeUpgrade for the console is enabled.
  helm.sh/images: |
    - name: base
      image: registry1.dso.mil/ironbank/big-bang/base:2.1.0
    - name: console
      image: registry1.dso.mil/ironbank/twistlock/console/console:34.05.157
    - name: defender
      image: registry1.dso.mil/ironbank/twistlock/defender/defender:34.05.157
      condition: defender.enabled
    - name: kubectl
      image: registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.36
      condition: waitJob.enabled

  bigbang.dev/upstreamReleaseNotesMarkdown: |
    - [Find upstream chart's release notes and CHANGELOG here](https://docs.prismacloud.io/en/compute-edition)
