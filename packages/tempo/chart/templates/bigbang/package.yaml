{{- if .Values.bigbangPackage.enabled }}
apiVersion: bigbang.dev/v1alpha1
kind: Package
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.bigbangPackage.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.bigbangPackage.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.bigbangPackage.istio }}
  istio:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- /* controlPlaneCidr is consumed by the upgrade-job NetworkPolicy, not the operator */}}
  {{- with omit .Values.bigbangPackage.networkPolicies "controlPlaneCidr" }}
  networkPolicies:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with .Values.bigbangPackage.routes }}
  routes:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
