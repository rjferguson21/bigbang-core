{{- if .Values.kyvernoPolicyException.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ .Release.Name }}-neuvector
  namespace: {{ .Values.kyvernoPolicyException.namespace }}
spec:
  background: true
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
            - DaemonSet
            - Job
            - CronJob
          namespaces:
            - {{ .Release.Namespace }}
          names:
            - neuvector-enforcer-pod*
            - neuvector-controller-pod*
            - neuvector-cert-upgrader-job*
            - neuvector-scanner-pod*
            - neuvector-prometheus-exporter-pod*
  exceptions:
    {{- range .Values.kyvernoPolicyException.policies }}
    - policyName: {{ . }}
      ruleNames: ["*"]
    {{- end }}
{{- end }}
