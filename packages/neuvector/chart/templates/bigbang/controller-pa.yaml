{{- if and .Values.bigbangPackage.istio.enabled (eq .Values.bigbangPackage.istio.injection "enabled") }}
apiVersion: "security.istio.io/v1beta1"
kind: PeerAuthentication
metadata:
  name: controller-neuvector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: neuvector-controller-pod
  mtls:
    mode: {{ .Values.bigbangPackage.istio.mtls.mode }}
  {{- if (eq .Values.bigbangPackage.istio.mtls.mode "STRICT") }}
  portLevelMtls:
    "18300":
      mode: PERMISSIVE
  {{- end }}
{{- end }}
