# Big Bang Additions
domain: dev.bigbang.mil
# Used for Istio SSO serviceEntry

bbtests:
  # -- Enable internal Big Bang package tests. This profile and any dependency
  # configuration supplied by tests/test-values*.yaml are unsupported for
  # consumer deployments.
  enabled: false
  scripts:
    image: "registry1.dso.mil/ironbank/big-bang/devops-tester:1.3"
    additionalVolumes:
    - name: docker-config
      secret:
        secretName: private-registry
        items:
        - key: .dockerconfigjson
          path: auth.json
    additionalVolumeMounts:
    - name: docker-config
      mountPath: /.docker/
    envs:
      GITLAB_USER: "root"
      GITLAB_EMAIL: "gitlab-root-user@example.com"
      GITLAB_HOST: gitlab-webservice-default.gitlab.svc.cluster.local:8181
