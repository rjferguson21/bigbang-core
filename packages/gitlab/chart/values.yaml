    ## https://docs.gitlab.com/charts/charts/gitlab/gitlab-grafana
    #   gitlab-grafana:
    ## https://docs.gitlab.com/charts/charts/gitlab/gitlab-pages
    gitlab-pages:
      service:
        customDomains:
          type: ClusterIP
      image:
        repository: registry1.dso.mil/gitlab/gitlab-org/build/cng/gitlab-pages
        tag: v19.3.2-ubi
    kas:
      ingress:
        enabled: false # Local setting in subchart must be overridden
      image:
        repository: registry1.dso.mil/gitlab/gitlab-org/build/cng/gitlab-kas
        tag: v19.3.2-ubi
