# Renders a bigbang.dev/v1alpha1 Package CR from the istio, networkPolicies,
# and routes values below. Requires the bigbang-operator to be installed.
# The subtrees are passed to the CR spec as-is; anything unset falls back to
# the operator's defaults.
bigbangPackage:
  enabled: true
  labels: {}
  annotations: {}

  istio:
    enabled: false
    authorizationPolicies:
      enabled: true
      generateFromNetpol: true

  routes:
    inbound:
      gitlab:
        enabled: true
        gateways:
        - istio-gateway/public-ingressgateway
        hosts:
        - gitlab.{{ .Values.domain }}
        # the custom http rules below drive the VirtualService; service/port
        # are still required by the operator (ServiceEntry + netpol)
        service: gitlab-webservice-default
        port: 8181
        http:
        - fault:
            abort:
              httpStatus: 403
              percentage:
                value: 100
          match:
          - uri:
              prefix: /-/metrics
          route:
          - destination:
              host: gitlab-webservice-default
              port:
                number: 8181
        - match:
          - uri:
              prefix: /
          route:
          - destination:
              host: gitlab-webservice-default
              port:
                number: 8181
        - match:
          - uri:
              prefix: /admin/sidekiq
          route:
          - destination:
              host: gitlab-webservice-default
              port:
                number: 8080
        selector:
          app: webservice
      registry:
        enabled: false
        gateways:
        - istio-gateway/public-ingressgateway
        hosts:
        - registry.{{ .Values.domain }}
        service: gitlab-registry
        port: 5000
        selector:
          app: registry
    outbound:
      gitlab:
        enabled: true
        hosts:
        - gitlab.com
        - version.gitlab.com
      gravatar:
        enabled: true
        hosts:
        - secure.gravatar.com

  networkPolicies:
    enabled: false
    ingress:
      to:
        redis:9121:
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: true
        gitlab-exporter:9168:
          podSelector:
            matchLabels:
              app: gitlab-exporter
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: true
        gitaly:9236:
          podSelector:
            matchLabels:
              app: gitaly
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: true
        webservice:[8083,8084,9229]:
          podSelector:
            matchLabels:
              app: webservice
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: true
        registry:5001:
          podSelector:
            matchLabels:
              app: registry
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: true
    # sso/database-subnets/redis-subnets/storage-subnets resolve from the
    # operator's shared definitions (bigbang-operator-global). The umbrella
    # only grants database/redis egress to webservice and migrations; gitlab
    # with the now-required external services needs them on every rails
    # component, so sidekiq/toolbox/gitlab-exporter get them here too.
    egress:
      from:
        "*":
          to:
            definition:
              kubeAPI: true
        webservice:
          podSelector:
            matchLabels:
              app: webservice
          to:
            definition:
              sso: true
              database-subnets: true
              redis-subnets: true
              storage-subnets: true
        sidekiq:
          podSelector:
            matchLabels:
              app: sidekiq
          to:
            definition:
              database-subnets: true
              redis-subnets: true
              storage-subnets: true
        migrations:
          podSelector:
            matchLabels:
              app: migrations
          to:
            definition:
              database-subnets: true
              redis-subnets: true
        toolbox:
          podSelector:
            matchLabels:
              app: toolbox
          to:
            definition:
              database-subnets: true
              redis-subnets: true
              storage-subnets: true
        gitlab-exporter:
          podSelector:
            matchLabels:
              app: gitlab-exporter
          to:
            definition:
              database-subnets: true
              redis-subnets: true
        registry:
          podSelector:
            matchLabels:
              app: registry
          to:
            definition:
              storage-subnets: true

## NOTICE
#
# Due to the scope and complexity of this chart, all possible values are
# not documented in this file. Extensive documentation is available.
#
# Please read the docs: https://docs.gitlab.com/charts/
#
# Because properties are regularly added, updated, or relocated, it is
# _strongly suggest_ to not "copy and paste" this YAML. Please provide
# Helm only those properties you need, and allow the defaults to be
# provided by the version of this chart at the time of deployment.

## Advanced Configuration
## https://docs.gitlab.com/charts/advanced
#
