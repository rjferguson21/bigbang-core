        runAsGroup: 1000
    mailroom:
      image:
        repository: registry1.dso.mil/gitlab/gitlab-org/build/cng/gitlab-mailroom
        tag: v19.3.2-ubi
      containerSecurityContext:
        capabilities:
          drop:
