apiVersion: v2
name: fluentbit
description: Fast and lightweight log processor and forwarder or Linux, OSX and BSD family operating systems. This variant delegates Istio and NetworkPolicy configuration to the Big Bang operator via a Package CR instead of bb-common.
keywords:
  - logging
  - fluent-bit
  - fluentd
version: 0.57.9-bb.2
appVersion: v5.0.9
icon: https://raw.githubusercontent.com/cncf/artwork/master/projects/fluentd/fluentbit/icon/fluentbit-icon-color.svg
home: https://fluentbit.io/
sources:
  - https://github.com/fluent/fluent-bit/
annotations:
  bigbang.dev/maintenanceTrack: bb_integrated
  bigbang.dev/upstreamReleaseNotesMarkdown: |
    - [Find the upstream fluent-bit release notes here](https://fluentbit.io/announcements/)
  helm.sh/images: |
    - name: fluent-bit
      image: registry1.dso.mil/ironbank/opensource/fluent/fluent-bit:v5.0.9
    - name: script-tests
      condition: bbtests.enabled
      image: registry1.dso.mil/ironbank/big-bang/base:2.1.0
    - name: configmap-reload
      image: registry1.dso.mil/ironbank/opensource/jimmidyson/configmap-reload:v0.15.0
dependencies:
  - name: fluent-bit
    version: 0.57.9
    repository: https://fluent.github.io/helm-charts
    alias: upstream
