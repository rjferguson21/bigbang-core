# yaml-language-server: $schema=https://raw.githubusercontent.com/k3d-io/k3d/refs/heads/main/pkg/config/v1alpha5/schema.json
#
# k3d cluster for bigbang-core dev. Based on the Big Bang bb-k3d config
# (registry1 pull-through cache, MetalLB IP range, host aliases), but the
# injected bootstrap (k3d/bootstrap.yaml) installs Argo CD instead of Flux,
# and metrics-server is left enabled so HPAs report healthy.
#
# Rendered by the Taskfile via envsubst (REGISTRY1_USERNAME/REGISTRY1_PASSWORD)
# then applied with `k3d cluster create --config <rendered>` from the repo root
# (so the relative bootstrap source path resolves).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bb-helm
image: rancher/k3s:v1.33.3-k3s1
agents: 3
subnet: 172.28.0.0/16
kubeAPI:
  hostIP: 0.0.0.0
  hostPort: "6443"
hostAliases:
  - ip: 172.28.0.4
    hostnames:
      - keycloak.dev.bigbang.mil
      - vault.dev.bigbang.mil
  - ip: 172.28.0.3
    hostnames:
      - gitlab.dev.bigbang.mil
      - registry.dev.bigbang.mil
      - kiali.dev.bigbang.mil
      - argocd.dev.bigbang.mil
      - prometheus.dev.bigbang.mil
      - alertmanager.dev.bigbang.mil
      - minio.dev.bigbang.mil
      - minio-api.dev.bigbang.mil
      - loki.dev.bigbang.mil
      - grafana.dev.bigbang.mil
      - twistlock.dev.bigbang.mil
      - sonarqube.dev.bigbang.mil
      - neuvector.dev.bigbang.mil
      - kibana.dev.bigbang.mil
      - harbor.dev.bigbang.mil
      - backstage.dev.bigbang.mil
      - chat.dev.bigbang.mil
volumes:
  - volume: /etc/machine-id:/etc/machine-id
    nodeFilters:
      - server:0
      - agent:*
ports:
  - port: 80:80
    nodeFilters:
      - server:*
  - port: 443:443
    nodeFilters:
      - server:*
options:
  k3s:
    extraArgs:
      - arg: --tls-san=0.0.0.0
        nodeFilters:
          - server:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
registries:
  create:
    name: repo1
    proxy:
      remoteURL: https://registry1.dso.mil
      username: ${REGISTRY1_USERNAME}
      password: ${REGISTRY1_PASSWORD}
    # Reuse the Big Bang dev cache volume so the pull-through cache stays warm
    volumes:
      - /home/rob/bb/bigbang/dev/reg:/var/lib/registry
  config: |
    mirrors:
      "registry1.dso.mil":
        endpoint:
          - http://repo1:5000
    configs:
      registry1.dso.mil:
        auth:
          username: ${REGISTRY1_USERNAME}
          password: ${REGISTRY1_PASSWORD}
files:
  # source is resolved relative to this config file, so the Taskfile renders
  # the config into k3d/ (beside bootstrap.yaml)
  - description: 'Bootstrap (MetalLB + Argo CD)'
    source: bootstrap.yaml
    destination: /var/lib/rancher/k3s/server/manifests/bootstrap.yaml
