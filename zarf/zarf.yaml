kind: ZarfPackageConfig
metadata:
  name: bigbang-core
  version: "0.1.0"
  description: >-
    Big Bang core (full default stack: operator, CRDs, Istio, Kyverno +
    policies + reporter, monitoring, Loki, Grafana, Alloy) for airgapped
    install via Zarf. Mirrors this repo into the in-cluster git and the core
    images into the in-cluster registry; the zarf-agent rewrites the Flux
    GitRepository, OCIRepository, and pod image references automatically.
  url: https://github.com/rjferguson21/bigbang-core

components:
  # Flux (helm-controller + source-controller) is a prerequisite — deploy it
  # first via its own Zarf package / init. See zarf/README.md. bigbang-core's
  # parent chart emits HelmRelease + Package CRs that Flux + the operator
  # reconcile.
  - name: bigbang-core
    required: true
    description: "GitRepository + parent HelmRelease (full default stack), reconciled by Flux"
    # Mirror the local charts into gitea; the operator OCI chart is bundled
    # alongside the images below. Resolved at
    # `zarf package create` — swap to a ###ZARF_PKG_TMPL_*### to parameterize.
    repos:
      - "https://github.com/rjferguson21/bigbang-core.git"
    manifests:
      - name: bigbang-core
        namespace: flux-system
        files:
          - manifests/core-values.yaml
          - manifests/bigbang-core.yaml
    # Every image the full stack pulls, from each chart's helm.sh/images
    # annotation. Ambient is the default mesh mode, so istio-cni + ztunnel are
    # included. The zarf-agent rewrites these refs on the running pods to the
    # in-cluster registry.
    images:
      # Helm OCI artifact consumed by the operator's Flux OCIRepository.
      - ghcr.io/rjferguson21/charts/bigbang-operator:0.5.0-bb.0
      - ghcr.io/rjferguson21/bigbang-operator:0.5.0-bb.0
      - registry1.dso.mil/ironbank/big-bang/base:2.1.0
      - registry1.dso.mil/ironbank/big-bang/grafana/grafana-plugins:13.0.1
      - registry1.dso.mil/ironbank/big-bang/grafana/grafana-plugins:13.2.1
      - registry1.dso.mil/ironbank/grafana/grafana-enterprise-logs:v3.6.5
      - registry1.dso.mil/ironbank/kiwigrid/k8s-sidecar:2.11.2
      - registry1.dso.mil/ironbank/kiwigrid/k8s-sidecar:2.8.1
      - registry1.dso.mil/ironbank/nirmata/policy-reporter/policy-reporter-ui:2.5.1
      - registry1.dso.mil/ironbank/opensource/bats/bats:1.13.0
      - registry1.dso.mil/ironbank/opensource/bats/bats:1.14.0
      - registry1.dso.mil/ironbank/opensource/grafana/alloy-operator:1.11.0
      - registry1.dso.mil/ironbank/opensource/grafana/alloy:v1.18.0
      - registry1.dso.mil/ironbank/opensource/grafana/grafana-image-renderer:v5.12.3
      - registry1.dso.mil/ironbank/opensource/grafana/helm-chart-toolbox-kubectl:1.0
      - registry1.dso.mil/ironbank/opensource/grafana/loki:3.7.1
      - registry1.dso.mil/ironbank/opensource/ingress-nginx/kube-webhook-certgen:v1.6.9
      - registry1.dso.mil/ironbank/opensource/istio/install-cni:1.30.4
      - registry1.dso.mil/ironbank/opensource/istio/pilot:1.30.4
      - registry1.dso.mil/ironbank/opensource/istio/proxyv2:1.30.4
      - registry1.dso.mil/ironbank/opensource/istio/ztunnel:1.30.4
      - registry1.dso.mil/ironbank/opensource/kubernetes/kube-state-metrics:v2.19.1
      - registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.34
      - registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.34.6
      - registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.35
      - registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.35.6
      - registry1.dso.mil/ironbank/opensource/kubernetes/kubectl:v1.37
      - registry1.dso.mil/ironbank/opensource/kyverno:v1.19.1
      - registry1.dso.mil/ironbank/opensource/kyverno/kyverno/background-controller:v1.19.1
      - registry1.dso.mil/ironbank/opensource/kyverno/kyverno/cleanup-controller:v1.19.1
      - registry1.dso.mil/ironbank/opensource/kyverno/kyvernocli:v1.19.1
      - registry1.dso.mil/ironbank/opensource/kyverno/kyvernopre:v1.19.1
