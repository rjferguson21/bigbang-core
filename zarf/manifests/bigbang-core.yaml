# Parent release: a GitRepository for this repo + a HelmRelease sourcing the
# core chart (which renders the child HelmRelease per core package). Copy of
# core/bigbang-core.yaml; the zarf-agent repoints spec.url to the in-cluster gitea.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bigbang-core
  namespace: flux-system
spec:
  interval: 1m
  # Must match the repos: entry in zarf.yaml so the zarf-agent repoints it to gitea.
  url: "https://github.com/rjferguson21/bigbang-core.git"
  ref:
    branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang-core
  namespace: flux-system
spec:
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: core
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bigbang-core
  valuesFrom:
    - kind: ConfigMap
      name: bigbang-core-values
      optional: true
