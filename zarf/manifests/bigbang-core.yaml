# Parent release: a GitRepository for this repo + a HelmRelease sourcing the
# core chart (which renders the child HelmRelease per core package). This is the
# Zarf-templated copy of core/bigbang-core.yaml — Zarf substitutes the ZARF_VAR
# placeholders, and the zarf-agent repoints spec.url to the in-cluster gitea.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bigbang-core
  namespace: "###ZARF_VAR_FLUX_NAMESPACE###"
spec:
  interval: 1m
  url: "###ZARF_VAR_REPO_URL###"
  ref:
    branch: "###ZARF_VAR_TARGET_REVISION###"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang-core
  namespace: "###ZARF_VAR_FLUX_NAMESPACE###"
spec:
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: core
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bigbang-core
  valuesFrom:
    - kind: ConfigMap
      name: bigbang-core-values
      optional: true
