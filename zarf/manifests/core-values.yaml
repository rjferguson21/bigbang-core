# Overrides read by the parent HelmRelease (valuesFrom this ConfigMap).
# No profile set, so the full default stack deploys (all groups enabled).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-core-values
  namespace: flux-system
data:
  values.yaml: |
    # Zarf seeds the pull secret into flux-system (this release's namespace);
    # copy it into each package namespace so rewritten image refs can pull.
    imagePullSecret:
      copyFromReleaseNamespace: true
    # The zarf-agent rewrites every image to the in-cluster registry, so add it
    # to kyverno's approved registries (127.0.0.1:31999 is Zarf's default
    # NodePort); otherwise restrict-image-registries blocks the rewritten pods.
    packages:
      kyverno-policies:
        values:
          policies:
            restrict-image-registries:
              parameters:
                allow:
                  - registry1.dso.mil
                  - registry.dso.mil
                  - ghcr.io
                  - 127.0.0.1:31999
