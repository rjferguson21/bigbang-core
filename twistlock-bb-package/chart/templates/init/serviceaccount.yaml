{{- if and .Values.init.enabled (not .Values.deploymentMode.defenderOnly) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "twistlock-init.name" . }}
  labels: {{- include "twistlock-init.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.init.serviceAccount.automountServiceAccountToken }}
{{- end }}