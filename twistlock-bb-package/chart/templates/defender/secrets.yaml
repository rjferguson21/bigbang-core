{{- if .Values.deploymentMode.defenderOnly }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "twistlock.name" . }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  service-parameter: {{ required "defender.secrets.service_parameter must be defined in values.yaml." .Values.defender.secrets.service_parameter }}
  defender-ca.pem: {{ required "defender.secrets.defender_ca must be defined in values.yaml." .Values.defender.secrets.defender_ca }}
  defender-client-cert.pem: {{ required "defender.secrets.defender_client_cert must be defined in values.yaml." .Values.defender.secrets.defender_client_cert }}
  defender-client-key.pem: {{ required "defender.secrets.defender_client_key must be defined in values.yaml." .Values.defender.secrets.defender_client_key }}
  defender-ca.pem.old: {{ required "defender.secrets.defender_ca_old must be defined in values.yaml." .Values.defender.secrets.defender_ca_old }}
  defender-client-cert.pem.old: {{ required "defender.secrets.defender_client_cert_old must be defined in values.yaml." .Values.defender.secrets.defender_client_cert_old }}
  defender-client-key.pem.old: {{ required "defender.secrets.defender_client_key_old must be defined in values.yaml." .Values.defender.secrets.defender_client_key_old }}
  admission-cert.pem: {{ required "defender.secrets.admission_cert must be defined in values.yaml." .Values.defender.secrets.admission_cert }}
  admission-key.pem: {{ required "defender.secrets.admission_key must be defined in values.yaml." .Values.defender.secrets.admission_key }}
{{- end }}