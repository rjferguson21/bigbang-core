# Dev collector wiring: ship pod logs to loki, expose the logs collector to prometheus
upstream:
  destinations:
    loki:
      type: loki
      url: http://logging-loki.logging.svc.cluster.local:3100/loki/api/v1/push
  collectors:
    alloy-logs:
      enabled: true
      presets:
        - daemonset
        - filesystem-log-reader
      global:
        podSecurityContext:
          fsGroup: 0
  podLogsViaLoki:
    enabled: true
    destinations:
      - loki
serviceMonitors:
  - name: alloy-logs
    selectorLabels:
      app.kubernetes.io/name: alloy-logs
