# Minimal core profile for testing a single package: just the operator, the
# CRD charts, and istio (the operator's functional companions — Package CRs
# with istio/routes enabled need the CRDs, istiod, and the gateway).
# prometheus-operator-crds stays on so package charts that render
# ServiceMonitors don't fail on a missing CRD.
#
# Usage: task core:deploy CORE_VALUES=dev/values/core-minimal.yaml
# then e.g.: task package:deploy PKG=<name> RELEASE=<release> NS=<ns>
packages:
  kyverno:
    enabled: false
  kyverno-policies:
    enabled: false
  kyverno-reporter:
    enabled: false
  monitoring:
    enabled: false
  grafana:
    enabled: false
  loki:
    enabled: false
  alloy:
    enabled: false
